<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlowTour.js Multi-page - Page B</title>
  </head>
  <body>
    <main class="mx-auto grid max-w-4xl gap-6 p-8">
      <header class="grid gap-2">
        <h1 class="text-2xl font-semibold">Page B</h1>
        <p class="text-sm text-slate-600">
          A separate document. The JS context from page A is gone, so the tour instance no longer
          exists. Resuming means rebuilding the workflow and jumping to the persisted step.
        </p>
      </header>

      <div id="settings-panel" class="rounded-lg border border-slate-300 bg-white p-5">
        <h2 class="text-lg font-medium">Notification settings</h2>
        <p class="text-sm text-slate-600">Step 2 of the full-reload tour targets this panel.</p>
      </div>

      <section class="grid gap-3 border-t border-slate-300 pt-5">
        <div class="flex flex-wrap gap-2">
          <a
            href="./index.html"
            class="rounded border border-slate-400 px-4 py-2 text-sm font-medium"
          >
            Back to page A
          </a>
        </div>
        <pre
          id="log"
          class="h-72 overflow-auto rounded bg-slate-900 p-3 font-mono text-xs text-slate-100"
        ></pre>
      </section>
    </main>
    <script type="module" src="./page-b.ts"></script>
  </body>
</html>
