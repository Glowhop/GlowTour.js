<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glow Tour Vanilla</title>
  </head>
  <body>
    <main class="app-screen bg-lime-50/40">
      <a class="back-link inline-flex items-center gap-2 text-emerald-700" href="/">Playground</a>
      <section class="app-panel shadow-sm ring-1 ring-black/5">
        <h1 class="text-3xl font-semibold tracking-tight">Vanilla app</h1>
        <button class="w-fit" type="button" data-start-tour>Start tour</button>
        <span id="vanilla-tour-id-1" class="target-pill">Step 1</span>
        <span id="vanilla-tour-id-2" class="target-pill">Step 2</span>
        <button id="vanilla-tour-id-3" class="target-button target-shrink" type="button">
          Step 3
        </button>

        <glow-tour-root>
          <glow-tour-overlay></glow-tour-overlay>
          <glow-tour-pointer>
            <span data-glow-tour-pointer-content>☝️</span>
          </glow-tour-pointer>
          <glow-tour-popover>
            <glow-tour-header></glow-tour-header>
            <glow-tour-content></glow-tour-content>
            <glow-tour-footer>
              <glow-tour-back-trigger back-label="Previous step"></glow-tour-back-trigger>
              <glow-tour-next-trigger
                finish-label="Finish tour"
                next-label="Next step"
              ></glow-tour-next-trigger>
            </glow-tour-footer>
          </glow-tour-popover>
        </glow-tour-root>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
