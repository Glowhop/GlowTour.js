[mcp_servers.heroui-react]
# Intentionally left on `@latest` because this template expects local tooling setup
# to track the currently supported HeroUI MCP release.
command = "npx"
args = ["@heroui/react-mcp@latest"]
enabled = true

[mcp_servers.heroui-react.tools.get_component_docs]
approval_mode = "approve"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest"]
