name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
      - name: Reject prereleases explicitly
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$RELEASE_PRERELEASE" != "false" ]]; then
            echo "Prereleases cannot publish npm packages." >&2
            exit 1
          fi
      - name: Validate the stable release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag must be vX.Y.Z" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Require the release commit on main
        run: bun scripts/release-ancestry.ts "$GITHUB_SHA"
      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@11.5.1
          test "$(npm --version)" = "11.5.1"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and verify release artifacts
        run: |
          bun run check
          bun run typecheck
          bun test
          bun run build
          bun run pack
          bun run test:tarballs
          bun run --cwd apps/playground build
          bun run release:prepare -- --expected-version "$RELEASE_VERSION"
      - name: Publish missing packages in order
        run: bun run release:publish
