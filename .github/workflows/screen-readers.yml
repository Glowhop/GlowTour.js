name: Screen readers

# Real VoiceOver (macOS) and NVDA (Windows), driven by Guidepup against apps/screen-readers.
# Slower and noisier than the accessibility-tree job in ci.yml, so it runs on demand, weekly,
# and on pull requests that touch rendering code. Spoken transcripts are uploaded as evidence.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    paths:
      - "packages/**"
      - "apps/screen-readers/**"
      - ".github/workflows/screen-readers.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voiceover:
    name: VoiceOver (${{ matrix.browser }})
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run VoiceOver with WebKit (Safari), the pairing people use. Chromium is the
        # slowest and least stable pairing, so it runs on the weekly schedule and on demand only.
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["webkit"]') || fromJSON('["webkit", "chromium"]') }}
    env:
      SCREEN_READER_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: Prepare macOS for VoiceOver automation
        working-directory: apps/screen-readers
        # The macOS runner grants the Apple Events permission unreliably: setup then fails with
        # "Not authorized to send Apple events to System Events" before any test runs. A new
        # attempt usually gets the permission, so a flaky image does not fail the job.
        run: |
          for attempt in 1 2 3; do
            if npx @guidepup/setup setup --ci --macos-record; then exit 0; fi
            echo "::warning::VoiceOver setup attempt ${attempt} of 3 failed"
            sleep 15
          done
          exit 1
      - name: Install VoiceOver assets
        working-directory: apps/screen-readers
        run: npx @guidepup/setup install voiceover
      - name: Install Playwright browser
        run: bun run --cwd apps/screen-readers playwright install --with-deps ${{ matrix.browser }}
      - name: Run VoiceOver tests
        run: bun run --cwd apps/screen-readers test:voiceover
      - name: Upload transcripts and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voiceover-${{ matrix.browser }}
          path: |
            apps/screen-readers/transcripts
            apps/screen-readers/playwright-report
            apps/screen-readers/test-results
            apps/screen-readers/recordings
          if-no-files-found: ignore

  nvda:
    name: NVDA (${{ matrix.browser }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      SCREEN_READER_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: Prepare Windows for NVDA automation
        working-directory: apps/screen-readers
        run: npx @guidepup/setup setup --ci
      - name: Install NVDA assets
        working-directory: apps/screen-readers
        run: npx @guidepup/setup install nvda
      - name: Install Playwright browser
        run: bun run --cwd apps/screen-readers playwright install --with-deps ${{ matrix.browser }}
      - name: Run NVDA tests
        run: bun run --cwd apps/screen-readers test:nvda
      - name: Upload transcripts and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nvda-${{ matrix.browser }}
          path: |
            apps/screen-readers/transcripts
            apps/screen-readers/playwright-report
            apps/screen-readers/test-results
          if-no-files-found: ignore
